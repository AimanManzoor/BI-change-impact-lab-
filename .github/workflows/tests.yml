name: SQL dependency checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

      - name: Check GraphRAG references
        run: python -m evals.evaluate_graphrag
      - name: Gate planner regression references
        run: python -m evals.evaluate_planner
      - name: Measure planner challenges (behavior mismatches are non-gating)
        run: python -m evals.evaluate_planner --suite challenge --measure
